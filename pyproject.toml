[project]
name = "mutiai-core"
version = "0.1.0"
description = "Core product, orchestration, and runtime services for mutiAI."
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph==1.2.9",
    "pydantic>=2.13,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mutiai"]
