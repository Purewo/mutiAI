[project]
name = "mutiai-core"
version = "0.1.0"
description = "Core product, orchestration, and runtime services for mutiAI."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.116,<1",
    "langgraph==1.2.9",
    "langgraph-checkpoint-sqlite>=3,<4",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.10,<3",
    "pwdlib[argon2]>=0.3,<1",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<3",
    "websockets>=15,<16",
]

[dependency-groups]
dev = [
    "httpx2>=2.8.0",
    "pytest>=8,<10",
    "uvicorn[standard]>=0.35,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mutiai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
